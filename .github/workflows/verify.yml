# Every 4 hours: merge green fix PRs, re-check unresolved findings, close
# resolved tickets, archive days whose findings are all resolved.
name: vuln-sentinel verify
on:
  schedule:
    - cron: "30 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: vuln-sentinel
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: BabyGrootCICD/cve_validator_patcher@v1
        with:
          token: ${{ secrets.SENTINEL_TOKEN }}
          mode: verify
          visibility: public
      - uses: BabyGrootCICD/cve_validator_patcher@v1
        with:
          token: ${{ secrets.SENTINEL_TOKEN }}
          mode: fix
          visibility: public
      - uses: BabyGrootCICD/cve_validator_patcher@v1
        with:
          token: ${{ secrets.SENTINEL_TOKEN }}
          mode: archive
          visibility: public
